name: Metrics

on:
  schedule:
    - cron: "0 12 * * *" # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # METRICS_TOKEN: a classic personal access token with read:user and public_repo scopes.
      # Leave out the "repo" scope so private repo names and code never show up.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_display: large
          config_timezone: UTC

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_calendar: yes

          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          plugin_lines: yes
          # Left out: notable (lists client orgs), achievements, habits and topics (broken upstream in v3.34).

          plugin_activity: yes
          plugin_activity_limit: 5
          plugin_activity_visibility: public
          plugin_code: yes
          plugin_code_visibility: public
          plugin_followup: yes
          plugin_reactions: yes
          plugin_discussions: yes
          plugin_introduction: yes
          plugin_gists: yes

          plugin_stars: yes
          plugin_stargazers: yes
          plugin_starlists: yes
          plugin_people: yes
          plugin_people_types: followers, following
